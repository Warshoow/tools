services:
    app:
        build:
          context: .
          dockerfile: ./Dockerfile.dev
        ports:
            - 3333:3333
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        #command: node ace scheduler:run
        environment:
            TZ: ${TZ}
            # bind to all interfaces so the port is reachable from the host
            HOST: 0.0.0.0
            # explicitly set the port (default is 3333 in .env)
            PORT: 3333
            LOG_LEVEL: ${LOG_LEVEL}
            APP_KEY: ${APP_KEY}
            NODE_ENV: ${NODE_ENV}
            SESSION_DRIVER: ${SESSION_DRIVER}
            APP_DOMAIN: ${APP_DOMAIN}
        depends_on: 
            - db
        networks:
            - network-test
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
          POSTGRES_USER: 
          POSTGRES_PASSWORD: 
          POSTGRES_DB: 
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
        networks:
            - network-test

volumes:
  postgres_data:
  node_modules:

networks:
  network-test:
    driver: bridge
